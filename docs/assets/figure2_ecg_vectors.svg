<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .grid { stroke: #1e293b; stroke-width: 0.75; }
      .grid-major { stroke: #334155; stroke-width: 1.2; }
      .text-title { fill: #f8fafc; font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; font-weight: 700; }
      .text-sub { fill: #94a3b8; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .text-annot { fill: #38bdf8; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; }
      .wave-sinus { stroke: #10b981; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wave-stemi { stroke: #f59e0b; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wave-vfib { stroke: #ef4444; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wave-asystole { stroke: #94a3b8; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#080c16" />

  <!-- Grid overlay -->
  <g class="grid">
    <!-- Vertical lines -->
    <line x1="0" y1="0" x2="0" y2="480" /><line x1="40" y1="0" x2="40" y2="480" /><line x1="80" y1="0" x2="80" y2="480" /><line x1="120" y1="0" x2="120" y2="480" /><line x1="160" y1="0" x2="160" y2="480" /><line x1="200" y1="0" x2="200" y2="480" /><line x1="240" y1="0" x2="240" y2="480" /><line x1="280" y1="0" x2="280" y2="480" /><line x1="320" y1="0" x2="320" y2="480" /><line x1="360" y1="0" x2="360" y2="480" /><line x1="400" y1="0" x2="400" y2="480" /><line x1="440" y1="0" x2="440" y2="480" /><line x1="480" y1="0" x2="480" y2="480" /><line x1="520" y1="0" x2="520" y2="480" /><line x1="560" y1="0" x2="560" y2="480" /><line x1="600" y1="0" x2="600" y2="480" /><line x1="640" y1="0" x2="640" y2="480" /><line x1="680" y1="0" x2="680" y2="480" /><line x1="720" y1="0" x2="720" y2="480" /><line x1="760" y1="0" x2="760" y2="480" /><line x1="800" y1="0" x2="800" y2="480" /><line x1="840" y1="0" x2="840" y2="480" /><line x1="880" y1="0" x2="880" y2="480" /><line x1="920" y1="0" x2="920" y2="480" />
    <!-- Horizontal lines -->
    <line x1="0" y1="30" x2="960" y2="30" /><line x1="0" y1="60" x2="960" y2="60" /><line x1="0" y1="90" x2="960" y2="90" /><line x1="0" y1="120" x2="960" y2="120" /><line x1="0" y1="150" x2="960" y2="150" /><line x1="0" y1="180" x2="960" y2="180" /><line x1="0" y1="210" x2="960" y2="210" /><line x1="0" y1="240" x2="960" y2="240" /><line x1="0" y1="270" x2="960" y2="270" /><line x1="0" y1="300" x2="960" y2="300" /><line x1="0" y1="330" x2="960" y2="330" /><line x1="0" y1="360" x2="960" y2="360" /><line x1="0" y1="390" x2="960" y2="390" /><line x1="0" y1="420" x2="960" y2="420" /><line x1="0" y1="450" x2="960" y2="450" />
  </g>

  <!-- Panel 1: Normal Sinus Rhythm (Top-Left) -->
  <g transform="translate(30, 20)">
    <text x="0" y="20" class="text-title">Vector A: Normal Sinus Rhythm (NSR)</text>
    <text x="0" y="36" class="text-sub">Manchester Triage: Level 5 Non-urgent • Formal Proof: 0xMTS-STABLE</text>
    <path class="wave-sinus" d="M 0 70 L 30 70 Q 38 60 46 70 L 60 70 L 65 74 L 72 25 L 78 82 L 84 70 L 105 70 Q 120 54 135 70 L 170 70 Q 178 60 186 70 L 200 70 L 205 74 L 212 25 L 218 82 L 224 70 L 245 70 Q 260 54 275 70 L 310 70 Q 318 60 326 70 L 340 70 L 345 74 L 352 25 L 358 82 L 364 70 L 385 70 Q 400 54 415 70 L 440 70" />
    <text x="38" y="52" class="text-annot">P</text>
    <text x="70" y="18" class="text-annot">R</text>
    <text x="122" y="48" class="text-annot">T</text>
  </g>

  <!-- Panel 2: Acute STEMI (Top-Right) -->
  <g transform="translate(510, 20)">
    <text x="0" y="20" class="text-title" fill="#f59e0b">Vector B: Acute Anterior STEMI (Ischemic Occlusion)</text>
    <text x="0" y="36" class="text-sub">Manchester Triage: Level 2 Very Urgent (Orange) • Invariant I3 Active</text>
    <path class="wave-stemi" d="M 0 70 L 25 70 Q 32 62 40 70 L 52 70 L 58 74 L 64 28 L 70 80 Q 85 45 110 50 L 130 70 L 165 70 Q 172 62 180 70 L 192 70 L 198 74 L 204 28 L 210 80 Q 225 45 250 50 L 270 70 L 305 70 Q 312 62 320 70 L 332 70 L 338 74 L 344 28 L 350 80 Q 365 45 390 50 L 410 70 L 440 70" />
    <text x="85" y="38" class="text-annot" fill="#f59e0b">ST-Elev (+3.4mm)</text>
  </g>

  <!-- Panel 3: Ventricular Fibrillation (Bottom-Left) -->
  <g transform="translate(30, 240)">
    <text x="0" y="20" class="text-title" fill="#ef4444">Vector C: Malignant Ventricular Fibrillation (OHCA)</text>
    <text x="0" y="36" class="text-sub">Manchester Triage: Level 1 Immediate (Red) • Formal Invariant I1 Triggered</text>
    <path class="wave-vfib" d="M 0 70 Q 12 40 24 75 Q 36 105 48 60 Q 60 30 72 85 Q 84 110 96 50 Q 108 20 120 70 Q 132 115 144 55 Q 156 35 168 85 Q 180 120 192 65 Q 204 25 216 75 Q 228 110 240 50 Q 252 30 264 80 Q 276 115 288 60 Q 300 20 312 70 Q 324 110 336 55 Q 348 35 360 85 Q 372 120 384 65 Q 396 25 408 75 Q 420 105 440 70" />
    <text x="100" y="130" class="text-annot" fill="#ef4444">Chaotic QRS Polymorphism (Pulseless Arrest)</text>
  </g>

  <!-- Panel 4: Asystole (Bottom-Right) -->
  <g transform="translate(510, 240)">
    <text x="0" y="20" class="text-title" fill="#94a3b8">Vector D: Resuscitation Asystole</text>
    <text x="0" y="36" class="text-sub">Manchester Triage: Level 1 Immediate (Red) • Automatic CPR Pacer Engaged</text>
    <path class="wave-asystole" d="M 0 70 Q 30 68 60 72 Q 90 71 120 69 Q 150 72 180 70 Q 210 68 240 71 Q 270 70 300 72 Q 330 69 360 71 Q 390 70 420 72 L 440 70" />
    <text x="140" y="90" class="text-annot" fill="#94a3b8">Flatline Isoelectric Baseline</text>
  </g>
</svg>
